<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Voice Pro — Live</title>
<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; color:#fff; font-family:Arial,sans-serif; }
#root { width:100%; height:100%; position:relative; display:flex; align-items:center; justify-content:center; }
canvas { max-width:100%; max-height:100%; width:100%; height:100%; object-fit:contain; background:#000; }
#status { position:absolute; left:16px; top:16px; z-index:4; padding:8px 12px; border-radius:7px; background:rgba(0,0,0,.65); color:#c9cdd2; font-size:13px; pointer-events:none; }
#streamer-name { position:absolute; left:18px; bottom:62px; z-index:5; max-width:45%; padding:6px 10px; border-radius:6px; background:rgba(0,0,0,.58); color:#fff; font-size:14px; font-weight:600; pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#controls { position:absolute; left:18px; right:18px; bottom:12px; z-index:6; display:none; align-items:center; gap:10px; height:38px; padding:0 10px; border-radius:7px; background:rgba(0,0,0,.72); box-sizing:border-box; }
#controls.visible { display:flex; }
#play { width:34px; height:30px; border:0; border-radius:5px; background:transparent; color:#fff; font-size:18px; cursor:pointer; flex:0 0 auto; }
#play:hover, #live:hover { background:rgba(255,255,255,.12); }
#timeline { flex:1 1 auto; min-width:0; accent-color:#5865f2; cursor:pointer; }
#live { flex:0 0 auto; border:0; border-radius:5px; padding:6px 9px; background:transparent; color:#fff; font-size:12px; font-weight:700; cursor:pointer; }
#live.live { color:#ed4245; }
#time { min-width:92px; text-align:right; color:#c9cdd2; font-size:12px; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<div id="root">
    <canvas id="video"></canvas>
    <div id="status">Conectando à transmissão…</div>
    <div id="streamer-name"></div>
    <div id="controls" aria-label="Controles avançados da transmissão">
        <button id="play" type="button" aria-label="Pausar">❚❚</button>
        <input id="timeline" type="range" min="0" max="0" step="0.05" value="0" aria-label="Linha do tempo da transmissão">
        <span id="time">AO VIVO</span>
        <button id="live" type="button" aria-label="Voltar ao vivo">AO VIVO</button>
    </div>
</div>
<script type="module" src="./stream-main.js"></script>
</body>
</html>
