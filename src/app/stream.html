<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Voice Pro — Live</title>
<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; color:#fff; font-family:Arial,sans-serif; }
#root { width:100%; height:100%; position:relative; display:flex; align-items:center; justify-content:center; }
canvas { max-width:100%; max-height:100%; width:100%; height:100%; object-fit:contain; background:#000; }
#status { position:absolute; left:16px; top:16px; z-index:2; padding:8px 12px; border-radius:7px; background:rgba(0,0,0,.65); color:#c9cdd2; font-size:13px; pointer-events:none; }
#close { position:absolute; right:16px; top:16px; z-index:3; border:0; border-radius:7px; padding:8px 12px; background:rgba(32,34,37,.9); color:#fff; cursor:pointer; }
#close:hover { background:#ed4245; }
</style>
</head>
<body>
<div id="root">
    <canvas id="video"></canvas>
    <div id="status">Conectando à transmissão…</div>
    <!-- <button id="close">Fechar</button> -->
</div>
<script type="module" src="./stream-main.js"></script>
</body>
</html>
